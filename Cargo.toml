[workspace]

members = [ "benchseed-tpch", "benchseed-tpcds" , "benchseed-tpch-arrow", "benchseed-tpch-cli", "benchseed-tpcds-arrow", "benchseed-cli"]

resolver = "2"

[workspace.package]
authors = ["clflushopt", "alamb", "Arnav Sharma"]
edition = "2021"
homepage = "https://github.com/Arnavsharma2/benchseed"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/Arnavsharma2/benchseed"
version = "3.0.0"

[workspace.dependencies]
arrow = { version = "60", default-features = false, features = ["prettyprint"] }
arrow-csv = "59"

[profile.release]
codegen-units = 1
lto = true
strip = "debuginfo"
