[package]
name = "benchseed-tpcds-arrow"
version = "0.1.0"
edition = "2021"
authors = ["clflushopt", "alamb", "Arnav Sharma"]
description = "TPC-DS data generator into Apache Arrow format"
repository = "https://github.com/Arnavsharma2/benchseed"
