[files]
extend-exclude = [
  "*.patch",
  "*.dss",
  "*.dst",
  "benchseed-tpch/src/q_and_a/",
]


[default]
extend-ignore-re = [
  "(?s)```.*?```", # ignore code blocks in markdown
  "(?s)//\\s*typos:off.*?//\\s*typos:on",
]

[default.extend-words]
auxillaries = "auxillaries"
# TPC-DS spells the store tax column as s_tax_precentage.
precentage = "precentage"
