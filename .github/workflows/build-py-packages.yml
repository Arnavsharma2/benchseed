name: Build Python Packages

on:
  workflow_call:
    inputs:
      upload-artifacts:
        description: "Whether to upload built distributions as artifacts"
        required: false
        default: false
        type: boolean
      package:
        description: "Package to build: all, benchseed-tpch-cli, or benchseed-cli"
        required: false
        default: all
        type: string

jobs:
  wheels:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Linux manylinux
          - runner: ubuntu-22.04
            target: x86_64
            manylinux: auto
            os: linux
          - runner: ubuntu-22.04
            target: x86
            manylinux: auto
            os: linux
          - runner: ubuntu-22.04
            target: aarch64
            manylinux: auto
            os: linux
          - runner: ubuntu-22.04
            target: armv7
            manylinux: auto
            os: linux
          - runner: ubuntu-22.04
            target: ppc64le
            manylinux: auto
            os: linux

          # Linux musllinux
          - runner: ubuntu-22.04
            target: x86_64
            manylinux: musllinux_1_2
            os: musllinux
          - runner: ubuntu-22.04
            target: x86
            manylinux: musllinux_1_2
            os: musllinux
          - runner: ubuntu-22.04
            target: aarch64
            manylinux: musllinux_1_2
            os: musllinux
          - runner: ubuntu-22.04
            target: armv7
            manylinux: musllinux_1_2
            os: musllinux

          # Windows
          - runner: windows-latest
            target: x64
            os: windows
          - runner: windows-latest
            target: x86
            os: windows

          # macOS
          - runner: macos-14
            target: aarch64
            os: macos
          - runner: macos-15-intel
            target: x86_64
            os: macos

    steps:
      - uses: actions/checkout@v7
      - name: Build benchseed-tpch-cli wheel
        if: ${{ inputs.package == 'all' || inputs.package == 'benchseed-tpch-cli' }}
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: benchseed-tpch-cli
          manylinux: ${{ matrix.manylinux || '' }}
      - name: Build benchseed-cli wheel
        if: ${{ inputs.package == 'all' || inputs.package == 'benchseed-cli' }}
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: benchseed-cli
          manylinux: ${{ matrix.manylinux || '' }}
      - name: Upload benchseed-tpch-cli wheels
        if: ${{ inputs.upload-artifacts && (inputs.package == 'all' || inputs.package == 'benchseed-tpch-cli') }}
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: benchseed-tpch-cli/dist
      - name: Upload benchseed-cli wheels
        if: ${{ inputs.upload-artifacts && (inputs.package == 'all' || inputs.package == 'benchseed-cli') }}
        uses: actions/upload-artifact@v7
        with:
          name: wheels-benchseed-cli-${{ matrix.os }}-${{ matrix.target }}
          path: benchseed-cli/dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build benchseed-tpch-cli sdist
        if: ${{ inputs.package == 'all' || inputs.package == 'benchseed-tpch-cli' }}
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: benchseed-tpch-cli
      - name: Build benchseed-cli sdist
        if: ${{ inputs.package == 'all' || inputs.package == 'benchseed-cli' }}
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: benchseed-cli
      - name: Upload benchseed-tpch-cli sdist
        if: ${{ inputs.upload-artifacts && (inputs.package == 'all' || inputs.package == 'benchseed-tpch-cli') }}
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: benchseed-tpch-cli/dist
      - name: Upload benchseed-cli sdist
        if: ${{ inputs.upload-artifacts && (inputs.package == 'all' || inputs.package == 'benchseed-cli') }}
        uses: actions/upload-artifact@v7
        with:
          name: sdist-benchseed-cli
          path: benchseed-cli/dist
